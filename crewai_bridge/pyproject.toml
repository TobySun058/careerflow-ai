[project]
name = "careerflow-crewai-bridge"
version = "0.1.0"
description = "Optional CrewAI planning sidecar for CareerFlow AI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "crewai>=0.130.0",
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "uvicorn>=0.30.0"
]

[project.scripts]
careerflow-crewai-bridge = "careerflow_crewai_bridge.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"
